
spring.application.name=banking-app

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info,metrics

KEYCLOAK_ADMIN=dev_admin
KEYCLOAK_ADMIN_PASSWORD=admin123